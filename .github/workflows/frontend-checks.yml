name: Frontend Checks

on:
  push:
    branches: [main]
    paths:
      - 'gestao/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    paths:
      - 'gestao/**'
      - '.github/workflows/frontend-checks.yml'

jobs:
  gestao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestao/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
