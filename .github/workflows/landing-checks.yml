name: Landing Checks

on:
  push:
    branches: [main]
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-checks.yml'
  pull_request:
    paths:
      - 'landing-page/**'
      - '.github/workflows/landing-checks.yml'

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
